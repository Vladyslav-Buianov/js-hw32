<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="timer" id="timer-1">
      <div class="field">
        <div class="flip-group" data-value="days">
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
        </div>
        <span class="label">Days</span>
      </div>
      <div class="field">
        <div class="flip-group" data-value="hours">
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
        </div>
        <span class="label">Hours</span>
      </div>
      <div class="field">
        <div class="flip-group" data-value="mins">
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
        </div>
        <span class="label">Minutes</span>
      </div>
      <div class="field">
        <div class="flip-group" data-value="secs">
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
          <div class="flip-card">
            <div class="top">0</div>
            <div class="bottom">0</div>
          </div>
        </div>
        <span class="label">Seconds</span>
      </div>
    </div>
    <script type="module" src="./js/plugin.js"></script>
  </body>
</html>
